<!-- sidebar.html -->
<style>
    /* Desain Wrapper Sidebar */
    .sidebar-wrapper {
        width: 260px;
        height: 100vh;
        background: #0f172a;
        color: #cbd5e1;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        border-right: 1px solid #1e293b;
        box-shadow: 4px 0 15px rgba(0,0,0,0.05);
    }
    
    /* Header Logo */
    .sidebar-header {
        padding: 24px;
        border-bottom: 1px solid #1e293b;
    }
    
    /* Area Menu (Scrollable) */
    .sidebar-nav {
        flex: 1;
        overflow-y: auto;
        padding: 20px 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    
    /* Custom Scrollbar agar tidak kaku */
    .sidebar-nav::-webkit-scrollbar { width: 6px; }
    .sidebar-nav::-webkit-scrollbar-track { background: transparent; }
    .sidebar-nav::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    
    /* Tampilan Link Menu */
    .nav-link {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        color: #94a3b8;
        text-decoration: none;
        border-radius: 12px;
        transition: all 0.3s ease;
        font-weight: 500;
        font-size: 0.95rem;
    }
    
    /* Efek Hover & Aktif */
    .nav-link:hover { background: #1e293b; color: #f8fafc; }
    .nav-link.active {
        background: rgba(16, 185, 129, 0.1);
        color: #10b981;
        border: 1px solid rgba(16, 185, 129, 0.2);
    }
    .nav-link i { font-size: 1.3rem; }
    
    /* Area Logout di Bawah */
    .sidebar-footer {
        padding: 20px 16px;
        border-top: 1px solid #1e293b;
    }
    .btn-logout {
        width: 100%;
        padding: 14px;
        background: #ef4444;
        color: white;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-weight: 600;
        transition: all 0.3s ease;
        font-family: inherit;
    }
    .btn-logout:hover { 
        background: #dc2626; 
        transform: translateY(-3px);
        box-shadow: 0 5px 15px rgba(239, 68, 68, 0.3);
    }
</style>

<div class="sidebar-wrapper">
    <div class="sidebar-header">
        <h3 style="margin: 0; color: white; font-size: 1.2rem; display: flex; align-items: center; gap: 8px;">
            <i class="ph-fill ph-shield-check" style="color: #10b981;"></i> Al-Hidayah CMS
        </h3>
        <span style="font-size: 0.8rem; color: #10b981; margin-left: 32px;">Superadmin Panel</span>
    </div>
    
    <nav class="sidebar-nav">
        <!-- Menggunakan Phosphor Icons -->
        <a href="dashboard.html" class="nav-link"><i class="ph ph-squares-four"></i> Beranda</a>
        <a href="pengaturan.html" class="nav-link"><i class="ph ph-gear"></i> Pengaturan Web</a>
        <a href="banner.html" class="nav-link"><i class="ph ph-images"></i> Kelola Banner</a>
        <a href="berita.html" class="nav-link"><i class="ph ph-newspaper"></i> Berita & Informasi</a>
        <a href="galeri.html" class="nav-link"><i class="ph ph-camera"></i> Galeri Kegiatan</a>
        <a href="ppdb.html" class="nav-link"><i class="ph ph-users-three"></i> Data PPDB</a>
        <a href="guru.html" class="nav-link"><i class="ph ph-chalkboard-teacher"></i> Data Pendidik</a>
    </nav>

    <div class="sidebar-footer">
        <button onclick="logoutCMS()" class="btn-logout">
            <i class="ph ph-sign-out"></i> Keluar Portal
        </button>
    </div>
</div>

<script>
    // Logika Pintar untuk mendeteksi halaman saat ini (Active State)
    (function() {
        // Ambil nama file dari URL saat ini (misal: "dashboard.html")
        const currentPath = window.location.pathname.split('/').pop() || 'dashboard.html';
        const links = document.querySelectorAll('.sidebar-nav .nav-link');
        
        links.forEach(link => {
            const linkHref = link.getAttribute('href');
            if (linkHref === currentPath) {
                link.classList.add('active'); // Beri warna hijau
                
                // Ubah ikon outline menjadi ikon tebal (fill) jika aktif
                const icon = link.querySelector('i');
                if(icon) {
                    icon.className = icon.className.replace('ph ', 'ph-fill ');
                }
            }
        });
    })();
</script>
